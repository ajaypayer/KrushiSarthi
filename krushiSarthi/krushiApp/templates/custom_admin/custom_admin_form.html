{% extends 'custom_admin/custom_admin_base.html' %}

{% block content %}
<div class="title">{{ page_title }}</div>
<div class="subtitle">{{ page_subtitle }}</div>

<div class="table-card" style="max-width: 600px;">
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div style="margin-top: 20px;">
            <button type="submit" class="add-btn" style="margin-bottom: 0;">Save</button>
            <a href="{{ cancel_url }}" style="margin-left: 10px; color: #666; text-decoration: none;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
